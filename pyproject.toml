[project]
name = "mini-rag-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "groq>=0.30.0,<1.0.0",
    "langchain>=1.4.7",
    "langchain-core>=1.6.13",
    "langchain-groq>=1.1.3",
    "langchain-mongodb>=0.12.1",
    "langchain-text-splitters>=1.1.3",
    "pymongo>=4.19.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
mini-rag-system = "mini_rag_system:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
